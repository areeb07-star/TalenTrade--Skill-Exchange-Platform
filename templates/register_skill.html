{% extends "base.html" %}
{% block title %}Add Skills | TalenTrade{% endblock %}
{% block content %}
<div class="card form">
  <h2>Add skills</h2>
  <form method="POST" autocomplete="off">
    <label>Skill you can teach</label>
    <input id="teach" name="teach" placeholder="Type to search...">
    <ul id="teachResults" class="suggestions"></ul>

    <label>Skill you want to learn</label>
    <input id="learn" name="learn" placeholder="Type to search...">
    <ul id="learnResults" class="suggestions"></ul>

    <button class="btn" type="submit">Save</button>
  </form>
</div>
<script>
attachSkillAutocomplete("teach", "teachResults");
attachSkillAutocomplete("learn", "learnResults");
</script>
{% endblock %}
